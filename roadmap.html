<script>
  // Deferred scripts finish before DOMContentLoaded, so globals exist here.
  document.addEventListener('DOMContentLoaded', function () {
    FWPageBoot.authBootThen(function () {
      if (!FWPageBoot.requireAuth('roadmap.html' + (location.search || ''))) return;
      if (window.FWRoadmap) {
        if (typeof FWRoadmap.bootPending === 'function') FWRoadmap.bootPending();
        if (typeof FWRoadmap.syncHashFocusState === 'function') FWRoadmap.syncHashFocusState();
        FWRoadmap.render();
      }
      if (window.FWAppNav) FWAppNav.sync('roadmap');
    });
  });
</script>
