<style>
  /* Month in Review (S11 UI) — scoped to #month-review. Client half of
     functions/month-review.js + functions/_lib/month-review.js; see
     assets/js/app/month-review.js. Section cards reuse the shared
     .fp-head/.fp-module/.fp-empty classes flightway-2.css already ships for
     flightplan.html, so this page reads as the same product rather than a
     new visual system — only the bits unique to this page (the month picker,
     list rows, the coordinates line, the skeleton, the error line) get rules
     here. Same house rule as flightplan.html's own block: --ok/--warn/--err
     only on border-color/background, never as a text color value. */
  #month-review { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  #month-review .mr-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  #month-review .mr-select-label {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px;
    font-weight: 600; color: rgb(var(--text-muted)); max-width: 100%;
  }
  #month-review .mr-select {
    padding: 7px 10px; border-radius: 8px; border: 1px solid rgb(var(--border));
    background: rgb(var(--surface)); color: rgb(var(--text)); font: inherit;
    font-size: 13px; max-width: 100%; box-sizing: border-box; transition: var(--transition);
  }
  #month-review .mr-select:hover { border-color: rgb(var(--border-strong)); }

  #month-review .mr-headline {
    margin: 0; font-size: 15.5px; line-height: 1.5; color: rgb(var(--text)); max-width: 70ch;
  }

  #month-review .mr-sections { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  #month-review .mr-list { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #month-review .mr-row {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 4px 12px; padding: 10px 12px; border-radius: 10px; min-width: 0;
    border: 1px solid rgb(var(--border)); background: rgb(var(--surface));
  }
  #month-review .mr-row-title {
    font-size: 13.5px; font-weight: 600; color: rgb(var(--text)); min-width: 0; overflow-wrap: anywhere;
  }
  #month-review .mr-row-meta { font-size: 12px; color: rgb(var(--text-muted)); }

  #month-review .mr-coordinates { margin: 0; font-size: 13.5px; line-height: 1.5; color: rgb(var(--text)); }

  #month-review .mr-focus {
    padding: 12px 14px; border-radius: 10px; min-width: 0;
    border: 1px dashed rgb(var(--border-strong)); background: rgb(var(--surface-2) / 0.5);
  }
  #month-review .mr-focus-text { margin: 0; font-size: 14px; font-weight: 600; color: rgb(var(--text)); overflow-wrap: anywhere; }
  #month-review .mr-focus-meta { margin: 6px 0 0; font-size: 12px; color: rgb(var(--text-muted)); }

  #month-review .mr-empty { display: flex; flex-direction: column; gap: 14px; }

  #month-review .mr-skeleton { display: flex; flex-direction: column; gap: 10px; }
  #month-review .mr-skel-line {
    height: 46px; border-radius: 12px; background: rgb(var(--surface-2));
    animation: mr-pulse 1.4s ease-in-out infinite;
  }
  @keyframes mr-pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  /* House rule (every animated stylesheet carries this): the skeleton holds
     still for reduced-motion readers — it is a placeholder, not information. */
  @media (prefers-reduced-motion: reduce) {
    #month-review .mr-skel-line { animation: none; }
  }

  /* Same house rule as flightplan.html's .fp-radar-form-error/.fp-commit-error:
     hue on the border, text stays on --text. */
  #month-review .mr-error {
    margin: 0; font-size: 13px; color: rgb(var(--text));
    padding: 10px 12px; border-left: 3px solid rgb(var(--err));
    background: rgb(var(--surface-2) / 0.5); border-radius: 0 10px 10px 0;
  }
</style>
