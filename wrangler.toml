name = "flightway"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

[[kv_namespaces]]
binding = "COACH_KV"
id = "90baa154928941c3b45ff0ecb4894f05"
preview_id = "d55c51ed0b6244979a96b88172f83cc5"

[[d1_databases]]
binding = "DB"
database_name = "flightway-db"
database_id = "e9aa71fb-dbf8-482d-ba86-5c941cdedee0"

# Optional O*NET R2 (not required — store.js falls back to /data/onet/artifacts/):
# wrangler r2 bucket create flightway-onet
# [[r2_buckets]]
# binding = "ONET_BUCKET"
# bucket_name = "flightway-onet"

[env.production]
compatibility_date = "2025-01-01"

[[env.production.kv_namespaces]]
binding = "COACH_KV"
id = "90baa154928941c3b45ff0ecb4894f05"

[[env.production.d1_databases]]
binding = "DB"
database_name = "flightway-db"
database_id = "e9aa71fb-dbf8-482d-ba86-5c941cdedee0"

# CORS allowlist: prototype pages.dev + canonical prod (comma-separated).
# originFromEnv() echoes the request Origin when it matches; otherwise first entry.
[env.production.vars]
ALLOWED_ORIGIN = "https://flightwayjacobprototype.pages.dev,https://flightway.ai"
# Pillar W web grounding master switch. ON activates grounded Google Search for
# EVERY Pillar W caller (chat, weekly-plan, career-analysis, resume, mock-interview,
# opportunity-finder) and spends the shared daily search budget. Requires the
# Gemini key to have "Grounding with Google Search" billing enabled.
GROUNDING_ENABLED = "true"
