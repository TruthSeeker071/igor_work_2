<script>
  // Deferred scripts finish before DOMContentLoaded, so globals exist here.
  document.addEventListener('DOMContentLoaded', function () {
    FWPageBoot.authBootThen(function () {
      if (!FWPageBoot.requireAuth('portal.html')) return;
      if (window.FWPortal && typeof FWPortal.render === 'function') FWPortal.render();
      if (window.FWSimPortalCard) FWSimPortalCard.inject();
      if (window.FWFlightPlanCard) FWFlightPlanCard.inject();
      if (window.FWReceiptsCard) FWReceiptsCard.inject();
      if (window.FWResumeBuilder) FWResumeBuilder.inject();
      if (window.FWNotifyOptin) FWNotifyOptin.inject();
      if (window.FWJobs) FWJobs.injectHomeCard();
      if (window.FWArtifacts) FWArtifacts.injectCard();
      if (window.FWDimensionViewer && typeof FWDimensionViewer.render === 'function') FWDimensionViewer.render();
      if (window.FWAppNav) FWAppNav.sync('home');
    });
  });
