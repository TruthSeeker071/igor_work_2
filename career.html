<script>
  // Deferred scripts finish before DOMContentLoaded, so globals exist here.
  document.addEventListener('DOMContentLoaded', function () {
    if (window.FWPageVeil) FWPageVeil.hold();
    var slug = '';
    var params = new URLSearchParams(location.search || '');
    slug = params.get('slug') || '';
    if (!slug) {
      var h = (location.hash || '').replace(/^#/, '');
      if (h.indexOf('career-') === 0) slug = h.slice(7);
    }
    if (!slug) {
      location.replace('dashboard.html');
      return;
    }
    function openCareer() {
      var socParam = params.get('soc') || '';
      var runShow = function (resolvedSoc) {
        if (typeof showCareer === 'function') showCareer(slug, 'hub', { soc: resolvedSoc || socParam });
        else location.replace('dashboard.html');
      };
      var proceed = function () {
        if (window.FWOnetVectors && typeof FWOnetVectors.resolveTargetSoc === 'function') {
          FWOnetVectors.resolveTargetSoc(slug, socParam).then(runShow).catch(function () { runShow(socParam); });
        } else {
          runShow(socParam);
        }
      };
      // AI-derived (synthetic 99-…) careers live only in D1, never in
      // careers.json — pull the single row into the catalog first, otherwise
      // showCareer() misses and renders a blank page.
      if (socParam.indexOf('99-') === 0 && window.FWOnetCatalog
        && typeof FWOnetCatalog.ensureDerivedRow === 'function') {
        FWOnetCatalog.ensureDerivedRow(socParam).then(proceed).catch(proceed);
      } else {
        proceed();
      }
    }
    function bootCareer() {
      if (window.FWOnetCatalog && typeof FWOnetCatalog.load === 'function') {
        FWOnetCatalog.load().then(openCareer).catch(openCareer);
      } else {
        openCareer();
      }
    }
    if (window.FWPageBoot && typeof FWPageBoot.authBootThen === 'function') {
      FWPageBoot.authBootThen(bootCareer);
    } else {
      bootCareer();
    }
    if (window.FWAppNav) FWAppNav.sync('hub');
  });
</script>
