<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=20260720f">
  <link rel="icon" href="/favicon.ico?v=20260720a" sizes="any">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-128.png?v=20260720a">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-180.png?v=20260720a">
  <title>Page not found — FlightWay</title>
  <meta name="robots" content="noindex">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2?v=20260720a" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/space-grotesk-latin.woff2?v=20260720a" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/flightway-theme.css?v=20260721p">
  <script src="assets/js/boot/theme-boot.js?v=20260703p"></script>
  <script src="assets/js/shared/brand.js?v=20260720i" defer></script>
  <!-- S1: a 404 is a real page_view — it is how a broken inbound link becomes
       visible instead of a silent bounce. -->
  <script src="assets/js/shared/events.js?v=20260724a" defer></script>
  <style>
    .fw-404 {
      /* Trimmed from 100vh so the footer added after </main> renders inside the
         initial viewport instead of getting pushed below the fold. */
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgb(var(--bg));
      color: rgb(var(--text));
    }
    .fw-404-card {
      max-width: 440px;
      width: 100%;
      text-align: center;
      background: rgb(var(--surface));
      border: 1px solid rgb(var(--border));
      border-radius: 16px;
      padding: 48px 32px;
    }
    .fw-404-code {
      font-size: 3rem;
      font-weight: 800;
      color: rgb(var(--primary));
      margin: 0 0 8px;
    }
    .fw-404-card h1 { font-size: 1.35rem; margin: 0 0 12px; }
    .fw-404-card p { margin: 0 0 24px; opacity: 0.75; line-height: 1.5; }
    .fw-404-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .fw-404-actions a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }
    .fw-404-brand { justify-content: center; margin-bottom: 20px; }
    .fw-404-home { background: rgb(var(--primary)); color: #fff; }
    .fw-404-hub { border: 1px solid rgb(var(--border)); color: rgb(var(--text)); }
    .fw-404-foot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid rgb(var(--border));
      font-size: 0.8rem;
      color: rgb(var(--text-muted));
    }
    .fw-404-foot p { margin: 0; }
    .fw-404-foot nav { display: flex; gap: 18px; }
    .fw-404-foot nav a {
      color: rgb(var(--text-muted));
      text-decoration: none;
    }
    .fw-404-foot nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="fw-404">
    <div class="fw-404-card">
      <a class="fw-404-brand fw-brand" href="/" data-fw-brand data-fw-brand-href="/" aria-label="FlightWay home"></a>
      <p class="fw-404-code">404</p>
      <h1>That page doesn’t exist</h1>
      <p>The link may be old, or the page may have moved. Your career matches are still right where you left them.</p>
      <div class="fw-404-actions">
        <a class="fw-404-home" href="/">Go home</a>
        <a class="fw-404-hub" href="/dashboard.html">Open Career Hub</a>
      </div>
    </div>
  </main>
  <footer class="fw-404-foot">
    <p>© 2026 FlightWay, Inc.</p>
    <nav><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/security">Security</a><a href="/contact">Contact</a></nav>
  </footer>
</body>
</html>
