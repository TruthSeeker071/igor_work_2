<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico?v=20260717h" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=20260717h">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260717h">
  <title>Page not found — FlightWay</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/flightway-theme.css?v=20260720c">
  <script src="assets/js/boot/theme-boot.js?v=20260703p"></script>
  <style>
    .fw-404 {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgb(var(--bg));
      color: rgb(var(--text));
    }
    .fw-404-card {
      max-width: 440px;
      width: 100%;
      text-align: center;
      background: rgb(var(--surface));
      border: 1px solid rgb(var(--border));
      border-radius: 16px;
      padding: 48px 32px;
    }
    .fw-404-code {
      font-size: 3rem;
      font-weight: 800;
      color: rgb(var(--primary));
      margin: 0 0 8px;
    }
    .fw-404-card h1 { font-size: 1.35rem; margin: 0 0 12px; }
    .fw-404-card p { margin: 0 0 24px; opacity: 0.75; line-height: 1.5; }
    .fw-404-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .fw-404-actions a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }
    .fw-404-home { background: rgb(var(--primary)); color: #fff; }
    .fw-404-hub { border: 1px solid rgb(var(--border)); color: rgb(var(--text)); }
  </style>
</head>
<body>
  <main class="fw-404">
    <div class="fw-404-card">
      <p class="fw-404-code">404</p>
      <h1>That page doesn't exist</h1>
      <p>The link may be old, or the page may have moved. Your career matches are still right where you left them.</p>
      <div class="fw-404-actions">
        <a class="fw-404-home" href="/">Go home</a>
        <a class="fw-404-hub" href="/dashboard.html">Open Career Hub</a>
      </div>
    </div>
  </main>
</body>
</html>
